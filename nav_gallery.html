<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品集 · 目录板块配图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #faf9f7; color: #1f2937; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; padding: 32px 20px; }
  h1 { text-align: center; font-size: 22px; margin-bottom: 6px; }
  .sub { text-align: center; color: #6b7280; font-size: 13px; margin-bottom: 28px; }
  .grid { max-width: 720px; margin: 0 auto; display: grid; gap: 28px; }
  figure { background: #fff; border-radius: 18px; overflow: hidden; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
  figure img { width: 100%; display: block; }
  figcaption { padding: 12px 16px; font-size: 15px; font-weight: 600; color: #374151; display: flex; justify-content: space-between; align-items: center; }
  .tag { font-size: 12px; color: #3b82f6; background: #eff6ff; padding: 2px 10px; border-radius: 999px; font-weight: 500; }
</style>
</head>
<body>
  <h1>作品集 · 目录板块配图</h1>
  <div class="sub">按网站导航顶层目录各截一张 · 真名已脱敏</div>
  <div class="grid">
    <figure><img src="images/nav/01_about.png"><figcaption><span>01 关于</span><span class="tag">首页 Hero</span></figcaption></figure>
    <figure><img src="images/nav/02_skills.png"><figcaption><span>02 能力</span><span class="tag">核心能力</span></figcaption></figure>
    <figure><img src="images/nav/03_experience.png"><figcaption><span>03 经历</span><span class="tag">工作经历</span></figcaption></figure>
    <figure><img src="images/nav/04_projects.png"><figcaption><span>04 项目</span><span class="tag">项目经历</span></figcaption></figure>
    <figure><img src="images/nav/05_cases.png"><figcaption><span>05 案例</span><span class="tag">项目案例</span></figcaption></figure>
    <figure><img src="images/nav/06_contact.png"><figcaption><span>06 联系</span><span class="tag">联系方式</span></figcaption></figure>
    <figure><img src="images/nav/07_industries.png"><figcaption><span>07 行业覆盖</span><span class="tag">饼图 + 服务客户</span></figcaption></figure>
  </div>
</body>
</html>
